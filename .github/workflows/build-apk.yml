name: Build DREAM APK

on:
  push:
    branches: [ main, dream-ui-fix-20260830 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply Android keyboard visibility fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/digital/madeiq/dream/MainActivity.kt')
          s = p.read_text()
          old = 'view.setPadding(bars.left, bars.top, bars.right, if (ime.bottom > 0) dp(4) else bars.bottom)'
          new = 'view.setPadding(bars.left, bars.top, bars.right, max(bars.bottom, ime.bottom))'
          if old not in s:
              raise SystemExit('Expected keyboard inset code not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DREAM-keyboard-fix-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
